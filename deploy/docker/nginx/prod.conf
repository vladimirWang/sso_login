# SSO 登录网关（生产环境 .env.prod）
# 前端为 Vite+React SPA（compose 挂载 frontend/dist 到 /usr/share/nginx/html），
# nginx 直接托管静态资源；仅 REST API 与 OAuth2 协议端点反向代理到 server:8888。
# 页面路由（/oauth/login、/demo-app、/demo-app/callback）走 try_files 回退 index.html。
# 同源部署：浏览器看到的前后端始终同一来源，服务端无需任何 CORS 配置。
upstream sso_auth_api {
    server server:8888;
    keepalive 32;
}

# 公共代理参数
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout    30s;
proxy_send_timeout    30s;

# HTTP 全部 301 跳转 HTTPS
# 注意：$host 不含端口，而对外 HTTPS 映射在 7443（非标准 443），
# 必须显式带上 :7443，否则会跳到默认 443 导致打不开
server {
    listen       80;
    server_name  _;

    return 301 https://$host:7443$request_uri;
}

# HTTPS 主入口（证书位于 deploy/docker/nginx/ssl，compose 挂载到 /etc/nginx/ssl）
server {
    listen       443 ssl;
    http2        on;
    server_name  todo.hetou.vip www.todo.hetou.vip;

    ssl_certificate     /etc/nginx/ssl/todo.hetou.vip.pem;
    ssl_certificate_key /etc/nginx/ssl/todo.hetou.vip.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    root   /usr/share/nginx/html;
    index  index.html;

    # REST JSON API：登录 / 注册 / 验证码 / 邮箱验证码等
    location /api/ {
        proxy_pass http://sso_auth_api;
    }

    # OAuth2 协议端点（注意：/oauth/login 是 SPA 页面，不在此列）
    location ~ ^/oauth/(authorize|token|userinfo|clientinfo|logout)(/|$) {
        proxy_pass http://sso_auth_api;
    }

    # 带 hash 的静态资源可强缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退：页面路由一律返回 index.html，由前端 router 渲染
    location / {
        try_files $uri $uri/ /index.html;
    }
}
