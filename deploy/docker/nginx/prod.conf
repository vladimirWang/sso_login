# SSO 登录网关（生产环境 .env.prod）：80 跳转 HTTPS，443 反代到 compose 内网中的 auth-api（server:8888）。
upstream sso_auth_api {
    server server:8888;
    keepalive 32;
}

# HTTP 全部 301 跳转 HTTPS
# 注意：$host 不含端口，而对外 HTTPS 映射在 7443（非标准 443），
# 必须显式带上 :7443，否则会跳到默认 443 导致打不开
server {
    listen       80;
    server_name  _;

    return 301 https://$host:7443$request_uri;
}

# HTTPS 主入口（证书位于 deploy/docker/nginx/ssl，compose 挂载到 /etc/nginx/ssl）
server {
    listen       443 ssl;
    http2        on;
    server_name  todo.hetou.vip www.todo.hetou.vip;

    ssl_certificate     /etc/nginx/ssl/todo.hetou.vip.pem;
    ssl_certificate_key /etc/nginx/ssl/todo.hetou.vip.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    # SSO 登录页 / OAuth2 协议端点 / 业务 API / 演示业务系统页均由 auth-api 提供
    location / {
        proxy_pass         http://sso_auth_api;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}
