# SSO 登录网关（开发环境 .env.dev）：纯 HTTP 入口
# 与 prod.conf 相同的职责划分：nginx 托管 Vite 构建的 SPA（frontend/dist），
# 仅 REST API 与 OAuth2 协议端点反代到 server:8888，同源无 CORS。
# 日常前端开发建议直接用 `pnpm dev`（Vite 5173 + proxy），无需经过此容器。
upstream sso_auth_api {
    server server:8888;
    keepalive 32;
}

proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout    30s;
proxy_send_timeout    30s;

server {
    listen       80;
    server_name  _;

    client_max_body_size 20m;

    root   /usr/share/nginx/html;
    index  index.html;

    location /api/ {
        proxy_pass http://sso_auth_api;
    }

    location ~ ^/oauth/(authorize|token|userinfo|clientinfo|logout)(/|$) {
        proxy_pass http://sso_auth_api;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
