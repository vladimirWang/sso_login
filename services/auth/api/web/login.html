<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSO 统一登录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1c3faa 0%, #1677ff 55%, #4096ff 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .panel { background: #fff; border-radius: 16px; box-shadow: 0 12px 48px rgba(0,0,0,.18);
           width: 400px; max-width: 100%; padding: 40px 36px 32px; }
  .logo { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 14px;
          background: linear-gradient(135deg, #1677ff, #4096ff); color: #fff;
          font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 20px; color: #222; text-align: center; font-weight: 600; }
  .app-tip { margin: 10px 0 22px; padding: 10px 14px; border-radius: 8px; background: #f0f6ff;
             color: #4a5a76; font-size: 13px; text-align: center; }
  .app-tip b { color: #1677ff; }
  .app-tip.invalid { background: #fff2f0; color: #cf1322; }
  .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #eee; }
  .tab { flex: 1; text-align: center; padding: 10px 0; font-size: 15px; color: #888; cursor: pointer;
         border-bottom: 2px solid transparent; transition: .2s; }
  .tab.active { color: #1677ff; border-bottom-color: #1677ff; font-weight: 600; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .field input { width: 100%; height: 42px; border: 1px solid #d9d9d9; border-radius: 8px;
                 padding: 0 12px; font-size: 14px; outline: none; transition: .2s; }
  .field input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,.12); }
  .captcha-row { display: flex; gap: 10px; }
  .captcha-row input { flex: 1; }
  .captcha-row img { width: 120px; height: 42px; border-radius: 8px; border: 1px solid #d9d9d9; cursor: pointer; }
  .btn { width: 100%; height: 44px; border: none; border-radius: 8px; background: #1677ff;
         color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: .2s; }
  .btn:hover { background: #4096ff; }
  .btn:disabled { background: #a8c7fa; cursor: not-allowed; }
  .msg { min-height: 18px; font-size: 13px; color: #cf1322; text-align: center; margin-bottom: 12px; }
  .hint { margin-top: 16px; font-size: 12px; color: #aaa; text-align: center; line-height: 1.6; }
  .pane { display: none; } .pane.active { display: block; }
</style>
</head>
<body>
<div class="panel">
  <div class="logo">S</div>
  <h1>SSO 统一登录</h1>
  <div id="appTip" class="app-tip" style="display:none"></div>

  <!-- 登录 -->
  <div id="paneLogin" class="pane active">
    <div class="tabs"><div class="tab active" id="tabLogin">登录</div><div class="tab" id="tabRegister">注册</div></div>
    <div class="msg" id="loginMsg"></div>
    <div class="field"><label>邮箱</label>
      <input id="loginEmail" type="email" placeholder="请输入邮箱" autocomplete="username"></div>
    <div class="field"><label>密码</label>
      <input id="loginPwd" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
    <div class="field"><label>验证码（点击图片刷新）</label>
      <div class="captcha-row">
        <input id="loginCaptcha" placeholder="请输入图中字符" maxlength="8">
        <img id="captchaImg" alt="验证码" title="点击刷新">
      </div>
    </div>
    <button class="btn" id="btnLogin">登 录</button>
  </div>

  <!-- 注册 -->
  <div id="paneRegister" class="pane">
    <div class="tabs"><div class="tab" id="tabLogin2">登录</div><div class="tab active" id="tabRegister2">注册</div></div>
    <div class="msg" id="regMsg"></div>
    <div class="field"><label>邮箱</label>
      <input id="regEmail" type="email" placeholder="请输入邮箱"></div>
    <div class="field"><label>用户名（可选，最长 8 位）</label>
      <input id="regName" placeholder="请输入用户名"></div>
    <div class="field"><label>密码（至少 6 位）</label>
      <input id="regPwd" type="password" placeholder="请输入密码"></div>
    <button class="btn" id="btnRegister">注 册</button>
  </div>

  <div class="hint">登录即代表同意授权该应用获取你的<br>基本信息（邮箱 / 用户名 / 租户）</div>
</div>

<script>
"use strict";
// ---------- 授权参数透传：登录成功后跳回 /oauth/authorize 完成 302 回业务系统 ----------
const params = new URLSearchParams(location.search);
const clientId    = params.get("client_id") || "";
const redirectUri = params.get("redirect_uri") || "";
const state       = params.get("state") || "";
const responseType= params.get("response_type") || "code";

const $ = (id) => document.getElementById(id);

async function sha256Hex(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

// ---------- 应用信息 ----------
async function loadClientInfo() {
  if (!clientId) {
    showTip("该页面为 SSO 登录页，需由业务系统跳转进入（携带 client_id 参数）", true);
    return;
  }
  try {
    const r = await fetch("/oauth/clientinfo?client_id=" + encodeURIComponent(clientId));
    const j = await r.json();
    if (j.code === 200 && j.valid) {
      showTip("「" + (j.name || clientId) + "」请求获取你的登录授权", false);
    } else {
      showTip("应用不存在或已被停用（client_id=" + clientId + "）", true);
      disableAll();
    }
  } catch (e) {
    showTip("授权服务暂不可用，请稍后重试", true);
    disableAll();
  }
}
function showTip(text, invalid) {
  const el = $("appTip");
  el.textContent = text;
  el.classList.toggle("invalid", !!invalid);
  el.style.display = "block";
}
function disableAll() {
  ["btnLogin", "btnRegister"].forEach(id => { $(id).disabled = true; });
}

// ---------- 验证码 ----------
let captchaId = "";
async function refreshCaptcha() {
  const r = await fetch("/api/v1/util/captcha");
  const j = await r.json();
  if (j.code === 200) {
    captchaId = j.data.captchaId;
    $("captchaImg").src = j.data.image;
    $("loginCaptcha").value = "";
  }
}
$("captchaImg").addEventListener("click", refreshCaptcha);

// ---------- 登录 ----------
// 密码推导协议与 repo_backend 一致：
//   库中 password = sha256(明文 + "_" + salt)
//   登录提交     = sha256(库中password + "_" + nonce)
$("btnLogin").addEventListener("click", async () => {
  const email = $("loginEmail").value.trim();
  const pwd   = $("loginPwd").value;
  const cap   = $("loginCaptcha").value.trim();
  setMsg("loginMsg", "");
  if (!email || !pwd || !cap) { setMsg("loginMsg", "请填写完整信息"); return; }

  $("btnLogin").disabled = true;
  try {
    // 1. salt（用户不存在时接口会返回错误）
    const saltResp = await fetch("/api/v1/auth/getSalt/" + encodeURIComponent(email));
    const saltJson = await saltResp.json();
    if (saltJson.code !== 200) {
      setMsg("loginMsg", saltJson.message || "用户不存在");
      await refreshCaptcha();
      return;
    }
    // 2. nonce
    const nonce = (await (await fetch("/api/v1/util/nonce")).json()).data;
    // 3. 两段 sha256
    const stored   = await sha256Hex(pwd + "_" + saltJson.data);
    const loginPwd = await sha256Hex(stored + "_" + nonce);
    // 4. 登录（成功后服务端已写 sso_token cookie）
    const r = await fetch("/api/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email, password: loginPwd,
        captchaId, captchaText: cap, nonce
      })
    });
    const j = await r.json();
    if (j.code === 200) {
      setMsg("loginMsg", "登录成功，正在跳转…", "#52c41a");
      const back = new URLSearchParams({
        client_id: clientId, redirect_uri: redirectUri,
        response_type: responseType, state
      });
      setTimeout(() => { location.href = "/oauth/authorize?" + back.toString(); }, 400);
      return;
    }
    setMsg("loginMsg", j.message || "登录失败");
    await refreshCaptcha();
  } catch (e) {
    setMsg("loginMsg", "网络异常，请重试");
    await refreshCaptcha();
  } finally {
    $("btnLogin").disabled = false;
  }
});

// ---------- 注册 ----------
$("btnRegister").addEventListener("click", async () => {
  const email = $("regEmail").value.trim();
  const name  = $("regName").value.trim();
  const pwd   = $("regPwd").value;
  setMsg("regMsg", "");
  if (!email || !pwd) { setMsg("regMsg", "请填写完整信息"); return; }
  $("btnRegister").disabled = true;
  try {
    const r = await fetch("/api/v1/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, username: name, password: pwd })
    });
    const j = await r.json();
    if (j.code === 200) {
      setMsg("regMsg", "注册成功，请登录", "#52c41a");
      $("loginEmail").value = email;
      setTimeout(switchToLogin, 600);
    } else {
      setMsg("regMsg", j.message || "注册失败");
    }
  } catch (e) {
    setMsg("regMsg", "网络异常，请重试");
  } finally {
    $("btnRegister").disabled = false;
  }
});

// ---------- Tab 切换与工具 ----------
function setMsg(id, text, color) {
  const el = $(id);
  el.textContent = text;
  el.style.color = color || "#cf1322";
}
function switchToLogin() {
  $("paneRegister").classList.remove("active");
  $("paneLogin").classList.add("active");
  $("tabLogin").classList.add("active");
  $("tabRegister2").classList.remove("active");
  refreshCaptcha();
}
$("tabRegister").addEventListener("click", () => {
  $("paneLogin").classList.remove("active");
  $("paneRegister").classList.add("active");
  $("tabRegister2").classList.add("active");
  $("tabLogin").classList.remove("active");
});
$("tabLogin2").addEventListener("click", switchToLogin);

loadClientInfo();
refreshCaptcha();
</script>
</body>
</html>
