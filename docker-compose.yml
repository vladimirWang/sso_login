# SSO 登录服务编排 —— 生产环境（Linux 服务器）
# 启动：docker compose up -d
#
# 只包含 nginx 网关与 server 业务服务两个服务。
# PostgreSQL / Redis / RabbitMQ 由服务器上基础设施 compose 提供，
# server 加入其外部 Docker 网络后用服务名访问：
#   PostgreSQL -> postgres:5432（private_chef_network）
#   Redis      -> redis:6379   （mac_docker_network）
#   RabbitMQ   -> rabbitmq:5672（mac_docker_network）
# etcd 为服务器本机进程，容器经 host-gateway 访问（host.docker.internal -> 宿主机网桥地址，
# 要求 etcd 监听 0.0.0.0 或 docker 网桥地址，不能只绑 127.0.0.1）。
# 以上连接地址均写在 .env.prod 中，经 env_file 注入，无需 environment 覆盖。
# nginx 只在 compose 默认网络，通过服务名 server:8888 反代。

services:
  # auth-rpc(:8081) + auth-api(:8888) 同容器运行，见 deploy/docker/entrypoint.sh
  server:
    # build 段仅供参考/特殊场景；生产部署镜像由 Mac 端 build.sh 交叉构建后 docker load 导入，
    # pull_policy: never 确保服务器上只使用本地镜像，绝不触发远程拉取或本机构建
    build:
      context: .
      dockerfile: Dockerfile
    image: sso-login-server:latest
    pull_policy: never
    container_name: sso-login-server
    env_file:
      - .env.prod
    extra_hosts:
      # Linux 宿主机地址，供容器访问宿主机上的 etcd（:2379）
      - "host.docker.internal:host-gateway"
    expose:
      - "8888" # auth-api（nginx 反代目标，仅 compose 内网可见）
      - "8081" # auth-rpc（仅内部服务注册/调用）
    restart: unless-stopped
    # 1.6G 小内存机器：单容器内存封顶 + 日志轮转，超限只杀本容器自动重启，不拖垮整机
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - default
      - private_chef_network
      - infra_network

  # 对外统一入口：7080->80（301 跳转 HTTPS），7443->443（prod.conf，证书在 ./deploy/docker/nginx/ssl）
  nginx:
    image: nginx:1.27-alpine
    container_name: sso-login-nginx
    depends_on:
      - server
    ports:
      - "7080:80"
      - "7443:443"
    volumes:
      - ./deploy/docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/docker/nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  private_chef_network:
    external: true
  infra_network:
    external: true
